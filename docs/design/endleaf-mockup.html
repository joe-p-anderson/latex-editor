<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Endleaf Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Crimson+Pro:ital,wght@0,400..700;1,400..600&family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a workbench. Bound chrome around a long wooden desk; one tall book lies on it and scrolls as far as the document goes.
   The palette chooses the marbling, gilt, logo and the paper stock; everything else is fixed material. */
:root{
  color-scheme:light;
  --paper:#F5EDDD; --ink:#2B2219; --ink-soft:#6E6152; --pencil:#9A8E7E; --detail:#9A3F22; --srcbg:rgba(120,85,35,.07); --math:#3D4F6E;
  --side:#EFE8DA; --tabpaper:#E6DDCB; --pdf:#FFFFFF;
  --gilt:#D9B45A;
  --foil:linear-gradient(115deg,#7A5516 0%,#D9B45A 20%,#F7E3A1 34%,#B8913A 50%,#E8C874 68%,#8A6420 85%,#D2AA50 100%);
  --grainimg:none; --woodimg:none; --marbleimg:none; --saddleimg:none; --linenimg:none; --leatherimg:none;
  --chrome-img:var(--saddleimg); --chrome-base:#A8703F; --cink:#2E1B0E; --cink-soft:#4A301C; --cactive:#120903; --chl:rgba(255,232,196,.35); --cbtn:rgba(255,240,215,.16);
  --f-ui:"Source Sans 3",system-ui,"Segoe UI",sans-serif;
  --f-page:"Crimson Pro",Georgia,"Times New Roman",serif;
  --f-display:"EB Garamond",Garamond,Georgia,serif;
  --f-type:"Courier Prime","Courier New",Courier,monospace;
  --page-size:19px; --textw:660px; --lightgrad:none;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#1A130E;color:var(--ink);font:13px/1.4 var(--f-ui);display:flex;flex-direction:column;overflow:hidden}
body.dragging{user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--detail);outline-offset:1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lg{display:block}.lg svg{width:100%;height:100%;display:block}
.paper{background-color:var(--paper);background-image:var(--grainimg);background-size:512px;background-blend-mode:soft-light}

/* ---------- mockup controls ---------- */
.mockbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 16px;background:#16110D;border-bottom:1px solid #000;font-size:12px;color:#A99478}
.mockbar .tag{font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:10px;color:#E8D6B4;padding:2px 7px;border:1px dashed #6E5A44;border-radius:4px}
.mk{display:flex;align-items:center;gap:6px}
.mk select{font:inherit;color:#EADBC0;background:#241B14;border:1px solid #4A3A2C;border-radius:5px;padding:2px 4px}
.mk input[type=range]{accent-color:#D9B45A;width:100px}
.mk output{font-variant-numeric:tabular-nums;color:#EADBC0;min-width:14ch}
.seg{display:inline-flex;border:1px solid #4A3A2C;border-radius:6px;overflow:hidden;background:#201811}
.seg button{border:0;background:none;padding:3px 8px;cursor:pointer;color:#A99478;font-size:12px}
.seg button+button{border-left:1px solid #4A3A2C}
.seg button.on{background:#3A2C20;color:#F2E2C2}
.mkbtn{border:1px solid #4A3A2C;background:#241B14;color:#EADBC0;border-radius:5px;padding:2px 8px;cursor:pointer}
.mkstatus{color:#D9B45A;font-style:italic}

/* ---------- chrome materials ---------- */
.window[data-chrome=saddle]{--chrome-img:var(--saddleimg);--chrome-base:#A8703F;--cink:#2A170A;--cink-soft:#4A2E18;--cactive:#0F0703;--chl:rgba(255,232,196,.38);--cbtn:rgba(255,240,215,.16)}
.window[data-chrome=linen]{--chrome-img:var(--linenimg);--chrome-base:#CDC6B4;--cink:#26231F;--cink-soft:#4F4A42;--cactive:var(--detail-chrome);--chl:rgba(255,255,255,.5);--cbtn:rgba(255,255,255,.3)}
.window[data-chrome=dark]{--chrome-img:var(--leatherimg);--chrome-base:#4A2A1A;--cink:#F0DDB8;--cink-soft:#D2BB92;--cactive:var(--gilt);--chl:rgba(0,0,0,.65);--cbtn:rgba(0,0,0,.2)}
.chrome{background:var(--chrome-img) 0 0/256px,var(--chrome-base);color:var(--cink)}

/* ---------- window ---------- */
.window{flex:1;min-height:0;display:grid;grid-template-rows:36px minmax(0,1fr) 24px;position:relative;background:#1A130E}
.titlebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:relative;z-index:8;box-shadow:inset 0 -1px 0 rgba(0,0,0,.45),0 1px 0 rgba(0,0,0,.35)}
.tb-left{display:flex;align-items:center;gap:2px;padding-left:12px;min-width:0;overflow:hidden}
.tb-logo{width:20px;height:20px;margin-right:8px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.tb-logo svg{width:100%;height:100%;display:block}
.menus{display:flex}
.menus button{border:0;background:none;padding:4px 8px;border-radius:3px;color:var(--cink);cursor:default;text-shadow:0 1px 0 var(--chl);font-weight:500}
.menus button:hover{background:var(--cbtn)}
.running{border:0;background-color:transparent;cursor:pointer;padding:2px 16px;border-radius:3px;font:600 16px var(--f-display);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis;color:var(--cink);text-shadow:0 1px 0 var(--chl)}
.running:hover{background-color:var(--cbtn)}
.running .sc{font-variant-caps:all-small-caps;letter-spacing:.1em}
.window[data-chrome=dark] .running{background-image:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.window[data-chrome=dark] .running:hover{background-color:transparent;filter:brightness(1.2) drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.tb-right{display:flex;justify-content:flex-end;align-items:center;height:100%;min-width:0;gap:6px}
.tbtn{height:24px;min-width:26px;padding:0 8px;border:1px solid rgba(0,0,0,.35);border-radius:4px;background:var(--cbtn);color:var(--cink);display:inline-grid;place-items:center;cursor:pointer;font-size:12.5px;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);text-shadow:0 1px 0 var(--chl)}
.tbtn:hover{filter:brightness(1.08)}
.tbtn.on{background:rgba(0,0,0,.22);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);color:var(--cactive)}
.window[data-chrome=saddle] .tbtn.on,.window[data-chrome=linen] .tbtn.on{background:rgba(0,0,0,.14)}
.tbtn .ic{width:16px;height:16px;stroke-width:1.8}
.tseg{display:inline-flex}
.tseg .tbtn{border-radius:0}.tseg .tbtn:first-child{border-radius:4px 0 0 4px}.tseg .tbtn:last-child{border-radius:0 4px 4px 0;border-left:0}
.tseg .tbtn:disabled{opacity:.45;cursor:default}
.build-note{font-size:12px;color:var(--cink-soft);margin:0 4px 0 6px;white-space:nowrap;font-weight:500;text-shadow:0 1px 0 var(--chl)}
.ribbon{flex:none;align-self:flex-start;width:20px;height:50px;margin:0 16px 0 2px;border:0;padding:0 0 13px;cursor:pointer;color:rgba(255,248,236,.95);
  background:linear-gradient(90deg,color-mix(in srgb,var(--detail-chrome) 70%,#000) 0,var(--detail-chrome) 22%,color-mix(in srgb,var(--detail-chrome) 72%,#fff) 45%,var(--detail-chrome) 62%,color-mix(in srgb,var(--detail-chrome) 65%,#000) 100%);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 8px),0 100%);display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.ribbon .ic{width:12px;height:12px;stroke-width:2.6}
.ribbon.err{--detail-chrome:#A32A1E}
.ribbon.busy{height:42px;animation:sway 1.2s ease-in-out infinite;transform-origin:top center}
@keyframes sway{50%{transform:rotate(3deg)}}
.winctl{display:flex;height:100%}
.winctl button{width:44px;border:0;background:none;display:grid;place-items:center;color:var(--cink-soft);cursor:default}
.winctl button:hover{background:var(--cbtn)}
.winctl button.close:hover{background:#A3261A;color:#fff}
.winctl .ic{width:13px;height:13px;stroke-width:1.3}

.work{display:grid;grid-template-columns:52px var(--sw,272px) 0 minmax(0,1fr);min-height:0;position:relative}
.activity{grid-column:1;grid-row:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;position:relative;z-index:4;box-shadow:inset -1px 0 0 rgba(0,0,0,.4)}
.sidebar{grid-column:2;grid-row:1}#split-side{grid-column:3;grid-row:1}.main{grid-column:4;grid-row:1}
.act{width:46px;height:44px;display:grid;place-items:center;border:0;background:none;position:relative;cursor:pointer;color:var(--cink-soft);filter:drop-shadow(0 1px 0 var(--chl))}
.act .ic{width:23px;height:23px;stroke-width:1.9}
.act:hover{color:var(--cink)}
.act.on{color:var(--cactive)}
.act.on::before{content:"";position:absolute;left:1px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--foil)}
.act-sep{width:26px;height:0;border-top:1px solid rgba(0,0,0,.3);border-bottom:1px solid var(--chl);margin:8px 0}
.act-label{font:700 8.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--cink-soft);margin-bottom:2px;text-shadow:0 1px 0 var(--chl)}
.act-spacer{flex:1}
.act .swatch{width:24px;height:24px;border-radius:5px;overflow:hidden;display:block;box-shadow:0 1px 2px rgba(0,0,0,.45)}

/* sidebar: plain paper */
.sidebar{min-width:0;display:flex;flex-direction:column;overflow:hidden;background-color:var(--side);background-image:var(--grainimg);background-size:512px;background-blend-mode:soft-light;color:var(--ink);box-shadow:inset -1px 0 0 rgba(0,0,0,.18)}
.sec{display:flex;flex-direction:column;min-height:0}
.sec+.sec{border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
.sec.grow{flex:1}
.sec-h{flex:none;display:flex;align-items:center;gap:4px;height:34px;padding:0 6px 0 12px;font:600 13px var(--f-display);letter-spacing:.12em;font-variant-caps:all-small-caps;color:var(--ink-soft);user-select:none}
.sec-h .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sec-h.fold{cursor:pointer}
.sec-h.fold .ic{width:12px;height:12px;transition:transform .15s}
.sec.open>.sec-h.fold .ic{transform:rotate(90deg)}
.sec:not(.open)>.sec-b{display:none}
.sec:not(.open).grow{flex:0}
.sec-b{overflow:auto;min-height:0;flex:1;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 25%,transparent) transparent}
.mini{width:22px;height:22px;border:0;background:none;border-radius:3px;display:grid;place-items:center;color:var(--ink-soft);cursor:pointer}
.mini:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.mini .ic{width:14px;height:14px}
.row{display:flex;align-items:center;gap:7px;height:25px;padding-right:10px;cursor:pointer;white-space:nowrap;border:0;background:none;width:100%;text-align:left;font:400 13.5px var(--f-ui);color:var(--ink)}
.row:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.row.on{background:color-mix(in srgb,var(--detail) 15%,transparent);font-weight:600}
.row .ic{width:12px;height:12px;color:var(--ink-soft)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .dot{width:6px;height:6px;border-radius:50%;background:var(--detail);margin-left:auto}
.ft{width:14px;text-align:center;font:600 12px/1 var(--f-page);color:var(--ink-soft);flex:none}
.ft.tex{color:var(--detail)}
.out{padding-left:14px}.out .n{color:var(--ink-soft);width:16px;flex:none;font-variant-numeric:tabular-nums}.out.sub{padding-left:30px;color:var(--ink-soft);font-size:13px}
.hint{font:italic 13px/1.45 var(--f-page);color:var(--ink-soft);padding:4px 12px 8px;margin:0}
.field{margin:4px 12px 6px;display:flex;align-items:center;border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);border-radius:4px;background:color-mix(in srgb,var(--paper) 70%,#fff)}
.field input{flex:1;min-width:0;border:0;background:none;padding:5px 8px;font:13.5px var(--f-ui);color:var(--ink);outline:none}
.field:focus-within{border-color:var(--detail)}
.opt{border:0;background:none;border-radius:3px;padding:1px 4px;margin-right:2px;font:700 11px/1.4 var(--f-type);color:var(--pencil);cursor:pointer}
.opt.on{color:var(--detail);background:color-mix(in srgb,var(--detail) 12%,transparent)}
.res-file{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;font-weight:600;font-size:13.5px}
.res-file .c{margin-left:auto;font-weight:500;font-size:12px;color:var(--ink-soft)}
.res{display:block;width:100%;border:0;background:none;text-align:left;padding:0 10px 0 30px;height:23px;font:13px/23px var(--f-ui);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.res:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.res mark{background:color-mix(in srgb,var(--detail) 25%,transparent);color:var(--ink)}
.pad{margin:6px 12px;position:relative}
.pad canvas{width:100%;height:124px;display:block;border-radius:4px;touch-action:none;cursor:crosshair;background:color-mix(in srgb,var(--paper) 60%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 22%,transparent)}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 16px;font:italic 13.5px var(--f-page);color:var(--pencil);pointer-events:none}
.guesses{display:flex;gap:6px;margin:0 12px 6px;flex-wrap:wrap;align-items:center}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;padding:6px 12px 12px}
.sym{height:34px;border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-radius:4px;background:color-mix(in srgb,var(--paper) 60%,#fff);font:20px/1 "STIX Two Math","Cambria Math",var(--f-page);color:var(--ink);cursor:pointer}
.sym:hover{color:var(--detail);border-color:var(--detail)}
.bibcard{display:block;width:calc(100% - 24px);margin:6px 12px;padding:7px 10px;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);border-radius:4px;background:color-mix(in srgb,var(--paper) 60%,#fff);text-align:left;font:13px/1.4 var(--f-page);color:var(--ink);cursor:pointer}
.bibcard:hover{border-color:var(--detail)}
.bibcard b{display:block;font:600 12px var(--f-type);color:var(--detail)}
.ctxnote{margin:2px 12px 8px;font:italic 13.5px/1.4 var(--f-page);color:var(--ink-soft)}

.splitter{position:relative;z-index:5}
.splitter::before{content:"";position:absolute;inset:0 -4px;cursor:col-resize}
.splitter.h::before{inset:-4px 0;cursor:row-resize}
.main{display:grid;grid-template-rows:minmax(0,1fr) 0 var(--ph,150px);min-width:0;min-height:0}
#split-panel{grid-row:2}.panel{grid-row:3}

/* ---------- the desk: a long table you scroll along ---------- */
.deskwrap{grid-row:1;position:relative;min-height:0;min-width:0;overflow:hidden}
.desk{position:absolute;inset:0;overflow:auto;background:var(--woodimg) 0 0/var(--desksize,256px) repeat,#5A564F;background-attachment:local;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.45) transparent}
.light{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;z-index:20;background:var(--lightgrad);transition:background .5s}
.desk-in{padding:44px 0 90px;min-height:100%;box-sizing:border-box}
.desk-in.toptabs{padding-top:14px}
.book{position:relative;width:var(--bookw,760px)}
.board{position:absolute;inset:-18px -20px -20px -18px;border-radius:3px 5px 5px 3px;background:var(--marbleimg) 0 0/1500px auto repeat,#6A3A26;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 14px 28px -14px rgba(0,0,0,.55),0 2px 5px rgba(0,0,0,.25)}
.board::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 3px rgba(0,0,0,.25),inset 1px 0 0 rgba(255,255,255,.1)}
.block{position:relative;z-index:2;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;padding:0 6px 5px 0}
.block.spread{padding-left:6px}
.edge{position:absolute;pointer-events:none}
.edge.r{top:0;right:0;bottom:0;width:6px;clip-path:polygon(0 0,100% 3px,100% 100%,0 calc(100% - 5px));
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.12)),repeating-linear-gradient(90deg,var(--paper) 0 1.2px,color-mix(in srgb,var(--paper) 78%,#000) 1.2px 1.9px)}
.edge.b{left:0;right:0;bottom:0;height:5px;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 100%,3px 100%);
  background:linear-gradient(transparent,rgba(0,0,0,.14)),repeating-linear-gradient(180deg,var(--paper) 0 1.2px,color-mix(in srgb,var(--paper) 78%,#000) 1.2px 1.9px)}
.edge.l{top:0;left:0;bottom:0;width:6px;clip-path:polygon(0 3px,100% 0,100% calc(100% - 5px),0 100%);
  background:linear-gradient(270deg,transparent,rgba(0,0,0,.12)),repeating-linear-gradient(90deg,color-mix(in srgb,var(--paper) 78%,#000) 0 .7px,var(--paper) .7px 1.9px)}
.block.spread .edge.b{clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 100%,0 100%)}
.leaves{position:relative;display:flex;align-items:stretch}
.leaf{position:relative;min-width:0;padding:60px var(--pad-r,90px) 110px var(--pad-l,56px);box-sizing:border-box}
.leaf.pdfleaf{background:var(--pdf);color:#151311}
.leaf::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 1px rgba(0,0,0,.25)}
.block.spread .leaf.verso::before,.block.spread .leaf.recto::before{content:"";position:absolute;top:0;bottom:0;width:34px;pointer-events:none;z-index:1}
.block.spread .leaf.verso::before{right:0;background:linear-gradient(270deg,rgba(0,0,0,.14),rgba(0,0,0,0))}
.block.spread .leaf.recto::before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.12),rgba(0,0,0,0))}
.gutter{width:0;position:relative;z-index:5}
.gutter::before{content:"";position:absolute;top:0;bottom:0;left:-5px;width:10px;cursor:col-resize}

/* printed text */
.col{max-width:var(--textw);font:400 var(--page-size)/1.56 var(--f-page);color:var(--ink);hyphens:auto;-webkit-hyphens:auto;font-kerning:normal;position:relative}
.verso .col{margin-left:auto}
.col.guides::after{content:"";position:absolute;top:-30px;bottom:0;left:0;right:0;border-inline:1px dashed color-mix(in srgb,var(--detail) 60%,transparent);pointer-events:none}
.guide-label{position:absolute;top:-38px;left:0;right:0;text-align:center;font:600 11px var(--f-ui);color:var(--detail);letter-spacing:.03em}
.blk{position:relative;margin:0 0 .8em;cursor:text;border-radius:2px}
.blk::before{content:"";position:absolute;left:-16px;top:.3em;bottom:.3em;width:2px;background:color-mix(in srgb,var(--ink) 30%,transparent);opacity:0;transition:opacity .15s}
.blk:hover::before{opacity:1}
.blk.flash{animation:flash 1.3s}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--detail) 20%,transparent)}100%{background:transparent}}
.blk.src{margin-left:-.7em;margin-right:calc(-1 * clamp(.7em,var(--pad-r,90px) - 36px,110px));padding:.4em .7em;background:var(--srcbg);box-shadow:inset 2px 0 0 var(--detail);
  font:400 calc(var(--page-size)*.74)/1.62 var(--f-type);white-space:pre-wrap;word-break:break-word;hyphens:none}
.blk.src::before{display:none}
.line{position:relative;min-height:1.62em}
.ln{position:absolute;right:calc(100% + .7em + 12px);top:0;font:italic 12px var(--f-page);line-height:inherit;color:var(--pencil);white-space:nowrap;word-break:normal;user-select:none}
.t-cmd{color:var(--detail)}.t-math{color:var(--math)}.t-com{color:var(--pencil);font-style:italic}.t-br{color:var(--ink-soft)}
.caret{display:inline-block;width:1.6px;height:1.15em;background:var(--ink);vertical-align:-.2em;margin:0 -.8px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
:is(.col,.pdfdoc) .course{margin:0;font-variant-caps:all-small-caps;letter-spacing:.12em;opacity:.72}
:is(.col,.pdfdoc) h1{font-size:1.75em;line-height:1.15;font-weight:600;margin:.1em 0 .15em;text-wrap:balance}
:is(.col,.pdfdoc) .due{margin:0;font-style:italic;opacity:.72}
:is(.col,.pdfdoc) h2{font-size:1.22em;font-weight:650;margin:1.4em 0 .15em;line-height:1.3;text-wrap:balance}
:is(.col,.pdfdoc) h2 .no{display:inline-block;min-width:1.6em}
:is(.col,.pdfdoc) p{margin:0;text-align:justify}
:is(.col,.pdfdoc) p.tcap{text-align:left}
:is(.col,.pdfdoc) .v{font-style:italic}
.col a.ref{color:var(--detail);text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer}
.pdfdoc a.ref{color:inherit;text-decoration:none}
:is(.col,.pdfdoc) .undef{font-weight:700}
.col .undef{color:#C0392B}
.col .star{color:var(--detail)}
math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math",math;font-size:1.02em}
.eq{display:flex;align-items:center;gap:1em;margin:.8em 0}
.eq math{flex:1;font-size:1.1em}
ol.parts{list-style:none;padding:0 0 0 2.1em;margin:.5em 0 0;counter-reset:p}
ol.parts li{position:relative;margin-bottom:.35em;counter-increment:p}
ol.parts li::before{content:"(" counter(p,lower-alpha) ")";position:absolute;left:-2.1em}
figure{margin:1.1em 0;text-align:center}
figure svg{width:min(100%,380px);height:auto;display:block;margin:0 auto .5em;overflow:visible}
figcaption,.tcap{font-size:.86em;line-height:1.45;text-align:left;max-width:34em;margin:0 auto}
figcaption b,.tcap b{font-weight:650}
.col .wide{margin-right:calc(-1 * clamp(0px,var(--pad-r,90px) - 30px,70px))}
.tablewrap{overflow-x:auto}
table.bk{border-collapse:collapse;width:100%;font-variant-numeric:lining-nums tabular-nums;border-top:1.4px solid currentColor;border-bottom:1.4px solid currentColor;margin:.2em 0 .6em}
table.bk th{font-weight:600;border-bottom:.8px solid currentColor;padding:.3em .8em;text-align:center;white-space:nowrap}
table.bk td{padding:.25em .8em;text-align:center}
table.bk th:first-child,table.bk td:first-child{text-align:left}
table.bk td.blank{opacity:.5}
.pdfdoc{width:560px;font:400 12px/1.45 var(--f-page);color:#151311}
.pdfdoc .blk{cursor:default;margin-bottom:.75em}.pdfdoc .blk::before{display:none}
.pdfbreak{margin:44px -200px 40px;height:14px;background:linear-gradient(rgba(0,0,0,.06),rgba(0,0,0,0) 40%),#F1F1EF;box-shadow:inset 0 1px 0 rgba(0,0,0,.08),inset 0 -1px 0 rgba(0,0,0,.08)}

/* ---------- file tabs, four ways ---------- */
/* 1. fore-edge index tabs */
.rail{position:absolute;top:0;bottom:0;left:calc(100% - 7px);width:130px;z-index:1;pointer-events:none}
.ftabs{position:sticky;top:22px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:36px 0 20px}
.ftab{pointer-events:auto;position:relative;display:flex;align-items:center;gap:6px;height:30px;max-width:124px;padding:0 9px 0 16px;border:0;border-radius:0 7px 7px 0;
  background-color:var(--tabpaper);background-image:var(--grainimg);background-size:512px;background-blend-mode:soft-light;color:var(--ink);font:500 12.5px var(--f-ui);
  box-shadow:1px 1px 0 rgba(0,0,0,.12),2px 2px 5px rgba(0,0,0,.28);cursor:pointer;transform:translateX(-8px);transition:transform .14s}
.ftab:hover{transform:translateX(-3px)}
.ftab.on{background-color:var(--paper);transform:none;font-weight:700;z-index:2}
.ftab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftab .dot{width:6px;height:6px;border-radius:50%;background:var(--detail);flex:none}
.ftab .x,.slip .x,.slab .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;opacity:0;color:inherit}
.ftab:hover .x,.slip:hover .x,.slab:hover .x{opacity:.7}
.ftab .x:hover,.slip .x:hover,.slab .x:hover{opacity:1;background:rgba(0,0,0,.12)}
.ftab .x .ic,.slip .x .ic,.slab .x .ic{width:10px;height:10px;stroke-width:2.2}
/* 2. thumb index (large) */
.thumbs{position:absolute;inset:0;z-index:1;pointer-events:none}
.thumb{position:absolute;right:-40px;width:80px;height:80px;border-radius:50%;clip-path:inset(0 50% 0 0);
  background:radial-gradient(circle at 50% 50%,transparent 0 24px,rgba(0,0,0,.14) 40px),repeating-radial-gradient(circle at 50% 50%,var(--paper) 0 1.3px,color-mix(in srgb,var(--paper) 74%,#000) 1.3px 2px)}
.thumb .lab{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:33px;height:24px;border-radius:2px;background:#16100B;display:grid;place-items:center;
  font:700 10.5px/1 var(--f-ui);letter-spacing:.01em;text-transform:uppercase;color:#C8B78F;box-shadow:0 0 0 .5px rgba(0,0,0,.5)}
.thumb.on .lab{background-image:var(--foil);color:#1B120C}
.thumb-hits{position:absolute;inset:0;z-index:4;pointer-events:none}
.thumb-hit{position:absolute;right:-8px;width:50px;height:72px;border:0;background:none;cursor:pointer;pointer-events:auto;padding:0}
.thumb-hit .tip{position:absolute;right:56px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--paper);color:var(--ink);font:13px var(--f-ui);padding:3px 8px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .12s}
.thumb-hit:hover .tip{opacity:1}
.thumb-hit .x{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:#16100B;color:#E9D9B4;display:grid;place-items:center;opacity:0}
.thumb-hit:hover .x{opacity:1}
.thumb-hit .x .ic{width:10px;height:10px;stroke-width:2.2}
/* 3 + 4. along the head of the book */
.topstrip{position:sticky;top:0;z-index:6;height:52px;margin-bottom:-24px;display:flex;align-items:flex-end;gap:8px;padding:0 18px;pointer-events:none;box-sizing:border-box}
.slip{pointer-events:auto;position:relative;display:flex;align-items:flex-start;gap:4px;width:118px;height:40px;padding:6px 6px 0 10px;border:0;cursor:pointer;
  background-color:var(--tabpaper);background-image:var(--grainimg);background-size:512px;background-blend-mode:soft-light;color:var(--ink);font:500 12.5px var(--f-ui);text-align:left;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transform:rotate(var(--rot,0deg)) translateY(6px);transition:transform .14s;clip-path:polygon(0 0,100% 2px,100% 100%,0 100%)}
.slip:hover{transform:rotate(var(--rot,0deg)) translateY(2px)}
.slip.on{background-color:var(--paper);transform:rotate(var(--rot,0deg)) translateY(-3px);font-weight:700;z-index:2}
.slip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slip .dot{position:absolute;left:4px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--detail)}
.slab{pointer-events:auto;display:flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 13px;border:0;cursor:pointer;border-radius:3px 3px 0 0;
  background:var(--leatherimg) 0 0/256px,#3E2416;color:#D9C194;font:600 13px var(--f-display);letter-spacing:.1em;font-variant-caps:all-small-caps;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,220,170,.15),0 -1px 3px rgba(0,0,0,.3);position:relative;transform:translateY(-14px)}
.slab::before,.slab::after{content:"";position:absolute;left:5px;right:5px;height:1px;background:var(--foil);opacity:.55}
.slab::before{top:4px}.slab::after{bottom:4px}
.slab.on{height:34px;transform:translateY(-14px);color:transparent;background-image:var(--foil),var(--leatherimg);-webkit-background-clip:text,border-box;background-clip:text,border-box;background-size:auto,256px}
.slab.on{color:#F4DE9C;background:var(--leatherimg) 0 0/256px,#2A170D;text-shadow:0 1px 0 #000}
.slab.on::before,.slab.on::after{opacity:1}
.slab .dot{width:5px;height:5px;border-radius:50%;background:var(--gilt)}

.riffle{position:absolute;z-index:15;perspective:1800px;perspective-origin:0% 50%;pointer-events:none;overflow:visible}
.riffle .rl{position:absolute;inset:0;transform-origin:0 50%;backface-visibility:hidden;background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0 17px,color-mix(in srgb,var(--ink) 7%,transparent) 17px 25px);
  background-size:calc(100% - 150px) calc(100% - 140px);background-position:60px 60px;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),-2px 0 6px rgba(0,0,0,.12)}

.empty-fill{min-height:62vh;background:var(--marbleimg) center/1500px auto,#6A3A26;display:grid;place-items:center;padding:30px;margin-right:-6px;margin-bottom:-5px}
.plate{position:relative;background-color:var(--paper);background-image:var(--grainimg);background-size:512px;background-blend-mode:soft-light;color:var(--ink);padding:26px 32px 22px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.plate::before{content:"";position:absolute;inset:7px;border:1.2px solid color-mix(in srgb,var(--ink) 65%,transparent);outline:.6px solid color-mix(in srgb,var(--ink) 50%,transparent);outline-offset:-4px;pointer-events:none}
.plate .exl{font:500 11px var(--f-display);letter-spacing:.34em;text-align:center;color:var(--ink-soft);margin:0 0 6px}
.empty-plate{width:min(360px,100%);text-align:center}
.empty-plate .lg{width:46px;height:46px;margin:0 auto 8px}
.empty-plate h3{font:500 24px var(--f-display);margin:0 0 12px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font:15px var(--f-page);color:var(--ink-soft);align-items:center}
kbd{font:700 11px var(--f-type);padding:2px 6px;border:1px solid color-mix(in srgb,var(--ink) 40%,transparent);border-bottom-width:2px;border-radius:3px;color:var(--ink);white-space:nowrap;justify-self:end}

/* welcome: the front endpaper with a bookplate */
.threshold{position:absolute;inset:36px 0 0 0;z-index:9;display:grid;place-items:center;padding:24px 16px;overflow:auto;background:var(--marbleimg) center/cover,#5A2A1C}
.threshold .plate{width:min(600px,100%);padding:30px 42px 30px}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.brand .lg{width:78px;height:78px;flex:none}
.brand h1{font:500 50px/1 var(--f-display);margin:0;letter-spacing:.01em}
.brand p{margin:6px 0 0;font:italic 16px var(--f-page);color:var(--ink-soft)}
.lbl{font:500 12px var(--f-display);letter-spacing:.24em;color:var(--ink-soft);margin:0 0 4px;border-bottom:.8px solid color-mix(in srgb,var(--ink) 35%,transparent);padding-bottom:3px;text-transform:uppercase}
.vaults{display:flex;flex-direction:column;margin:4px -10px 18px}
.vault{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:6px 10px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.vault:hover,.vault:focus-visible{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.vault .chip{width:44px;height:30px;display:block;background:center/cover;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.vault b{font:600 16px var(--f-page);display:block}
.vault small{font:12.5px var(--f-type);color:var(--ink-soft)}
.vault .when{font:italic 14px var(--f-page);color:var(--ink-soft);white-space:nowrap}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid color-mix(in srgb,var(--ink) 45%,transparent);background:transparent;padding:6px 14px;cursor:pointer;font:600 14px var(--f-page);color:var(--ink);border-radius:2px}
.btn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* bottom panel: paper */
.panel{min-height:0;display:flex;flex-direction:column;background-color:var(--side);background-image:var(--grainimg);background-size:512px;background-blend-mode:soft-light;color:var(--ink);box-shadow:inset 0 1px 0 rgba(0,0,0,.2)}
.panel-head{display:flex;align-items:center;gap:2px;height:32px;flex:none;padding:0 6px 0 8px}
.ptab{border:0;background:none;padding:5px 9px;font:600 14px var(--f-display);letter-spacing:.12em;font-variant-caps:all-small-caps;color:var(--ink-soft);cursor:pointer;position:relative}
.ptab.on{color:var(--ink)}
.ptab.on::after{content:"";position:absolute;left:9px;right:9px;bottom:1px;height:1.5px;background:var(--detail)}
.ptab .n{color:var(--detail);margin-left:3px}
.panel-body{flex:1;overflow:auto;min-height:0}
.prob{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0 14px;height:25px;text-align:left;font:13.5px var(--f-ui);cursor:pointer;color:var(--ink)}
.prob:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.prob .ic{width:14px;height:14px}
.prob .w{color:#A06A0C}.prob .i{color:#4E7939}
.prob code{font:12.5px var(--f-type)}
.prob .where{margin-left:auto;color:var(--ink-soft);white-space:nowrap;font:12.5px var(--f-type)}
.log{font:12.5px/1.65 var(--f-type);color:var(--ink-soft);padding:2px 14px;margin:0;white-space:pre-wrap}
.log .hl{color:#A06A0C}

.statusbar{display:flex;align-items:stretch;font-size:12px;white-space:nowrap;overflow:hidden;position:relative;z-index:8;box-shadow:inset 0 1px 0 rgba(0,0,0,.35)}
.sb{display:flex;align-items:center;gap:6px;padding:0 9px;border:0;background:none;cursor:pointer;color:var(--cink);font-size:12px;font-weight:500;text-shadow:0 1px 0 var(--chl)}
.sb:hover{background:var(--cbtn)}
.sb .ic{width:13px;height:13px;stroke-width:1.9}
.sb .chip{width:14px;height:14px;border-radius:2px;display:block;background:center/cover;box-shadow:0 0 0 .5px rgba(0,0,0,.5)}
.sb-spacer{flex:1}

/* overlays */
.pop{position:absolute;z-index:30;background-color:var(--side);background-image:var(--grainimg);background-size:512px;background-blend-mode:soft-light;color:var(--ink);border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.15)}
.endpop{left:58px;bottom:30px;width:min(480px,calc(100vw - 80px));padding:4px 14px 14px;max-height:calc(100% - 80px);overflow:auto}
.endpop h4{margin:10px 0 8px;font:600 14px var(--f-display);letter-spacing:.12em;font-variant-caps:all-small-caps;color:var(--ink-soft)}
.endpop .paperline{font:italic 13.5px var(--f-page);color:var(--ink-soft);margin:2px 0 0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.sw{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.sw .m{position:relative;display:block;height:60px;background:center/cover;box-shadow:0 1px 3px rgba(0,0,0,.35);outline:2px solid transparent;outline-offset:2px}
.sw .m .lg{position:absolute;right:5px;bottom:5px;width:20px;height:20px}
.sw.on .m{outline-color:var(--detail)}
.sw span{display:block;font:12.5px var(--f-ui);margin-top:4px}
.qo{top:46px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));overflow:hidden}
.qo input{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent);background:transparent;padding:11px 14px;font:15px var(--f-ui);color:var(--ink);outline:none}
.qo .list{max-height:330px;overflow:auto;padding:4px 0}
.qo .row{padding-left:14px;height:28px}.qo .row small{color:var(--ink-soft);font-size:12px;margin-left:6px}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);padding:6px 14px;font:13px var(--f-ui);border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.35);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#1A130E;color:#D6C09A;font:italic 18px var(--f-page)}
.ftab{width:138px;max-width:none}
.editors{grid-row:1;display:grid;grid-template-columns:minmax(0,1fr) 0 var(--pw,0px);min-height:0;min-width:0}
.editors>.deskwrap{grid-column:1;grid-row:1}#split-pdf{grid-column:2;grid-row:1}.pdfpane{grid-column:3;grid-row:1}
.pdfpane{position:relative;min-width:0;overflow:hidden;background:var(--marbleimg) center/cover,#5A2A1C;box-shadow:inset 1px 0 0 rgba(0,0,0,.4)}
.pdfscroll{position:absolute;inset:0;overflow:auto;padding:52px 0 40px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.45) transparent}
.pdfsheet{width:612px;min-height:792px;box-sizing:border-box;margin:0 auto 22px;background:#fff;color:#151311;padding:64px 74px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.pdfsheet .pdfdoc{width:auto}
.pdfbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:4px;padding:3px 4px 3px 12px;border-radius:16px;font-size:12.5px;font-weight:500;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4);text-shadow:0 1px 0 var(--chl)}
.pdfbar .tbtn{height:22px;min-width:24px;padding:0 6px;border-radius:11px}
.empty-ep{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:var(--marbleimg) center/cover,#5A2A1C}
/* the plain look: same structure, flat colours, marbling only as an accent */
.window[data-chrome=plain]{--chrome-img:none;--chrome-base:var(--p-bar);--cink:var(--p-text);--cink-soft:var(--p-muted);--cactive:var(--p-text);--chl:transparent;--cbtn:var(--p-sel)}
.window[data-look=plain] .desk{top:36px;background:var(--p-desk)}
.window[data-look=plain] .light{display:none}
.window[data-look=plain] .board,.window[data-look=plain] .rail{display:none}
.window[data-look=plain] :is(.paper,.sidebar,.panel,.pop,.plate){background-image:none}
.window[data-look=plain] .leaf::after{box-shadow:none}
.window[data-look=plain] .activity::after{content:"";position:absolute;right:0;top:0;bottom:0;width:9px;box-shadow:inset 1px 0 0 rgba(0,0,0,.2);background:var(--marbleimg) center/cover}
.window[data-look=plain] .act{filter:none;margin-right:9px;width:40px}
.window[data-look=plain] .empty-ep{top:40px}
.window[data-look=plain] .desk{top:40px}
.window[data-look=plain] .deskwrap::before{content:"";position:absolute;top:36px;left:0;right:0;height:4px;background:var(--marbleimg) center/cover;z-index:6;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.window[data-look=plain] .titlebar{box-shadow:inset 0 -1px 0 var(--p-line)}
.window[data-look=plain] .statusbar{box-shadow:inset 0 1px 0 var(--p-line)}
.window[data-look=plain] .sidebar{box-shadow:inset -1px 0 0 var(--p-line)}
.tabbar{display:none}
.window[data-look=plain] .tabbar{display:flex;position:absolute;top:0;left:0;right:0;height:36px;background:var(--p-chrome);border-bottom:1px solid var(--p-line);z-index:6;overflow-x:auto;scrollbar-width:none}
.ptb{display:flex;align-items:center;gap:7px;padding:0 6px 0 14px;border:0;border-right:1px solid var(--p-line);background:none;color:var(--p-muted);font:13px var(--f-ui);cursor:pointer;position:relative;white-space:nowrap;margin-bottom:-1px}
.ptb.on{background:var(--p-desk);color:var(--p-text)}
.ptb.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--foil)}
.ptb .dot{width:6px;height:6px;border-radius:50%;background:var(--p-text);opacity:.6}
.ptb .x{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;opacity:0}
.ptb:hover .x,.ptb.on .x{opacity:.8}
.ptb .x:hover{background:var(--p-sel)}
.ptb .x .ic{width:12px;height:12px}
/* the open book: your page on the left, the back endpaper on the right with the PDF lying on it */
.block.spread{padding:0 0 5px 6px}
.block.spread .edge.r{display:none}
.block.spread .edge.b{right:var(--rw,0px);clip-path:polygon(6px 0,100% 0,100% 100%,0 100%)}
.ep-recto{position:relative;flex:none;min-width:0;background:var(--marbleimg) 0 0/1500px auto repeat,#5A2A1C;box-shadow:inset 22px 0 26px -16px rgba(0,0,0,.5),inset 1px 0 0 rgba(0,0,0,.35)}
.ep-sticky{position:sticky;top:12px;height:var(--deskh,600px);display:flex;flex-direction:column;align-items:center;padding-top:10px;box-sizing:border-box}
.ep-scroll{flex:1;min-height:0;width:100%;overflow:auto;padding:4px 0 30px;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.45) transparent}
.rail.left{left:auto;right:calc(100% - 7px)}
.rail.left .ftabs{align-items:flex-end}
.rail.left .ftab{border-radius:7px 0 0 7px;padding:0 16px 0 9px;transform:translateX(8px);box-shadow:-1px 1px 0 rgba(0,0,0,.12),-2px 2px 5px rgba(0,0,0,.28)}
.rail.left .ftab:hover{transform:translateX(3px)}
.rail.left .ftab.on{transform:none}
.window[data-look=plain] .leaf.verso::before{display:none}
/* PDF controls pinned to the top of the endpaper in the open book */
.ep-sticky .pdfbar{position:relative;top:auto;left:auto;transform:none;margin:0 0 12px;flex:none;z-index:4}
/* Appearance panel (the theme builder) */
.tgroup{padding:4px 12px 10px}
.tlabel{font:600 14px var(--f-display);letter-spacing:.1em;font-variant-caps:all-small-caps;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tlabel output{font:12px var(--f-ui);letter-spacing:0;font-variant-caps:normal;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tchoices{display:flex;flex-wrap:wrap;gap:4px}
.tchoices button,.tbtn2{border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);background:transparent;color:var(--ink);border-radius:4px;padding:4px 9px;font:13px var(--f-ui);cursor:pointer}
.tchoices button:hover,.tbtn2:hover{border-color:color-mix(in srgb,var(--ink) 45%,transparent)}
.tchoices button.on{border-color:var(--detail);background:color-mix(in srgb,var(--detail) 18%,transparent);font-weight:600}
.tchoices button:disabled{opacity:.45;cursor:default}
.thint{margin:6px 0 0;font:italic 13.5px/1.35 var(--f-page);color:var(--ink-soft)}
.tsec{margin:8px 12px 6px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font:600 15px var(--f-display);color:var(--ink)}
.tsw.swatches{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 8px}
.tsw .sw .m{height:40px}
.tsw .sw .m .lg{width:16px;height:16px;right:4px;bottom:4px}
.tsw .sw span:last-child{font-size:11.5px;line-height:1.25}
.trow{display:flex;gap:6px;align-items:center;margin-top:9px}
#themepanel input[type=range]{width:100%;accent-color:var(--detail)}
.tcheck{display:flex;gap:7px;align-items:center;font:13px var(--f-ui);color:var(--ink);cursor:pointer}
.mknote{color:#A99478}
.topstrip.head{height:38px;margin-bottom:0;gap:5px;padding:0 26px;align-items:flex-end}
.topstrip.head.scrolled{background:linear-gradient(transparent 0,transparent 30%,var(--paper) 100%)}
.topstrip.head.scrolled::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;background:linear-gradient(var(--paper),transparent);pointer-events:none}
.htab{pointer-events:auto;display:flex;align-items:center;gap:6px;flex:none;width:138px;height:29px;padding:0 6px 0 13px;border:0;border-radius:7px 7px 0 0;cursor:pointer;
  background-color:var(--tabpaper);background-image:var(--grainimg);background-size:512px;background-blend-mode:soft-light;color:var(--ink);font:500 12.5px var(--f-ui);
  box-shadow:0 -1px 0 rgba(0,0,0,.1),1px -2px 5px rgba(0,0,0,.25);transition:height .14s}
.htab:hover{height:32px}
.htab.on{background-color:var(--paper);height:35px;font-weight:700;z-index:2}
.htab .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.htab .dot{width:6px;height:6px;border-radius:50%;background:var(--detail);flex:none}
.htab .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;opacity:0}
.htab:hover .x{opacity:.7}.htab .x:hover{opacity:1;background:rgba(0,0,0,.12)}
.htab .x .ic{width:10px;height:10px;stroke-width:2.2}
@media (max-width:1000px){.build-note{display:none}}
@media (max-width:900px){.menus,.running{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  else if (st === 'head') $('#topstrip').innerHTML = state.tabs.map(t => `<button class="htab ${t.p === state.tab ? 'on' : ''}" data-p="${t.p}" title="${esc(t.p)}">${t.dirty ? '<span class="dot"></span>' : ''}<span class="nm">${esc(t.n)}</span>${x(t.p)}</button>`).join('');
  else if (st === 'slips') $('#topstrip').innerHTML = state.tabs.map((t, i) => `<button class="slip ${t.p === state.tab ? 'on' : ''}" data-p="${t.p}" title="${esc(t.p)}" style="--rot:${[-1.2, .8, -.4, 1.4, -.9][i % 5]}deg">${t.dirty ? '<span class="dot"></span>' : ''}<span class="nm">${esc(t.n)}</span>${x(t.p)}</button>`).join('');
  else if (st === 'labels') $('#topstrip').innerHTML = state.tabs.map(t => `<button class="slab ${t.p === state.tab ? 'on' : ''}" data-p="${t.p}" title="${esc(t.p)}">${t.dirty ? '<span class="dot"></span>' : ''}<span>${esc(t.n.replace(/\.[^.]+$/, ''))}</span>${x(t.p)}</button>`).join('');
  else if (st === 'thumb') {
    $('#thumbs').innerHTML = state.tabs.map(t => `<div class="thumb ${t.p === state.tab ? 'on' : ''}" data-p="${t.p}"><span class="lab">${esc(abbr(t.n))}</span></div>`).join('');
    $('#thumb-hits').innerHTML = state.tabs.map(t => `<button class="thumb-hit" data-p="${t.p}" aria-label="${esc(t.n)}"><span class="tip">${esc(t.p)}${t.dirty ? ' · unsaved' : ''}</span><span class="x" data-x="${t.p}" title="Close">${ic('x')}</span></button>`).join('');
    positionThumbs();
  }
}
/* Thumb notches follow the view, so they're always within reach on a tall book. */
function positionThumbs() {
  if (state.tabstyle !== 'thumb' || !state.tabs.length) return;
  const desk = $('#desk'), book = $('#book'), block = $('#block');
  const bh = block.offsetHeight, top = Math.max(0, Math.min(bh - 120, desk.scrollTop - book.offsetTop + 30));
  const n = state.tabs.length, sp = Math.min(86, (Math.min(desk.clientHeight, bh) - 140) / Math.max(1, n));
  const ys = state.tabs.map((_, i) => Math.round(top + 60 + i * Math.max(40, sp)));
  const mask = ys.map(y => `radial-gradient(circle 40px at 100% ${y}px,transparent 39.4px,#000 40px)`).join(',');
  block.style.webkitMaskImage = block.style.maskImage = mask; block.style.maskComposite = 'intersect'; block.style.webkitMaskComposite = 'source-in';
  $$('#thumbs .thumb').forEach((el, i) => el.style.top = (ys[i] - 40) + 'px');
  $$('#thumb-hits .thumb-hit').forEach((el, i) => el.style.top = (ys[i] - 36) + 'px');
}
let scrollRAF = 0;
$('#desk').addEventListener('scroll', () => { if (!scrollRAF) scrollRAF = requestAnimationFrame(() => { scrollRAF = 0; positionThumbs(); $('#topstrip').classList.toggle('scrolled', $('#desk').scrollTop > $('#book').offsetTop - 30); }); });
for (const id of ['#ftabs', '#topstrip', '#thumb-hits', '#tabbar']) {
  $(id).addEventListener('click', e => {
    const xb = e.target.closest('[data-x]'); if (xb) { e.stopPropagation(); return closeTab(xb.dataset.x); }
    const t = e.target.closest('[data-p]'); if (t) switchTo(t.dataset.p);
  });
  $(id).addEventListener('auxclick', e => { const t = e.target.closest('[data-p]'); if (t && e.button === 1) closeTab(t.dataset.p); });
}

/* Riffle: a handful of leaves flick over the visible part of the page, then the book lands on the chosen file. */
let riffling = false;
function riffle(forward, swap) {
  const target = $('#leaf-live');
  if (reduced() || !target || state.look === 'plain') { swap(); return; }
  riffling = true;
  const wrap = $('#deskwrap'), wr = wrap.getBoundingClientRect(), lr = target.getBoundingClientRect();
  const top = Math.max(lr.top, wr.top), bottom = Math.min(lr.bottom, wr.bottom);
  const host = document.createElement('div'); host.className = 'riffle';
  Object.assign(host.style, { left: (lr.left - wr.left) + 'px', top: (top - wr.top) + 'px', width: lr.width + 'px', height: Math.max(80, bottom - top) + 'px' });
  const N = 6, leaves = [];
  for (let i = 0; i < N; i++) { const d = document.createElement('div'); d.className = 'rl'; host.appendChild(d); leaves.push(d); }
  wrap.appendChild(host);
  const dur = 170, gap = 38;
  if (forward) {
    swap();
    leaves.forEach((d, i) => d.animate([{ transform: 'rotateY(0deg)', filter: 'brightness(1)' }, { transform: 'rotateY(-92deg)', filter: 'brightness(.7)' }], { duration: dur, delay: i * gap, easing: 'cubic-bezier(.45,.05,.75,.6)', fill: 'forwards' }));
  } else {
    leaves.forEach((d, i) => { d.style.transform = 'rotateY(-92deg)'; d.animate([{ transform: 'rotateY(-92deg)', filter: 'brightness(.7)' }, { transform: 'rotateY(0deg)', filter: 'brightness(1)' }], { duration: dur, delay: i * gap, easing: 'cubic-bezier(.25,.4,.55,.95)', fill: 'forwards' }); });
    setTimeout(swap, dur);
    setTimeout(() => host.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, fill: 'forwards' }), dur + (N - 1) * gap);
  }
  setTimeout(() => { host.remove(); riffling = false; }, dur + (N - 1) * gap + 140);
}
function switchTo(p) {
  if (p === state.tab || riffling) return;
  const from = state.tabs.findIndex(t => t.p === state.tab), to = state.tabs.findIndex(t => t.p === p);
  riffle(to > from, () => { state.scrolls[state.tab] = $('#desk').scrollTop; state.tab = p; refreshDoc(); $('#desk').scrollTop = state.scrolls[p] || 0; });
}
function closeTab(p) {
  const i = state.tabs.findIndex(t => t.p === p); state.tabs.splice(i, 1);
  if (state.tab === p) state.tab = state.tabs[Math.max(0, i - 1)]?.p;
  state.screen = state.tabs.length ? 'workspace' : 'empty'; refreshDoc(); syncMock();
}
function openFile(p, quiet) {
  if (p.endsWith('.pdf')) { state.spread = true; renderBook(); return; }
  const had = state.tabs.find(t => t.p === p);
  if (!had) state.tabs.push({ n: p.split('/').pop(), p });
  if (had && state.tabs.length > 1 && state.tab && !quiet && state.screen === 'workspace') { switchTo(p); return; }
  state.tab = p; state.screen = 'workspace'; refreshDoc(); syncMock();
  if (!quiet && !['hw/hw04.tex', 'problems/p-incline.tex', 'problems/p-yoyo.tex'].includes(p) && p.endsWith('.tex')) toast('The mockup shows Homework 4 for every .tex file.');
}
function refreshDoc() {
  const v = vault(), f = currentFile();
  $('#running').innerHTML = state.screen === 'welcome' ? '<span class="sc">endleaf</span>' : `<span class="sc">${esc(v.short)}</span>${f ? ` · <i>${esc(f.n)}</i>` : ''}`;
  renderBook(); renderStatus();
  const tr = $('#tree'); if (tr) tr.innerHTML = treeHTML(TREE);
}


/* ================= panel, status, ribbon ================= */
function renderPanel() {
  $$('.ptab').forEach(b => b.classList.toggle('on', b.dataset.p === state.ptab));
  const body = $('#panel-body');
  if (state.ptab === 'problems') body.innerHTML = PROBLEMS.map((p, k) => `<button class="prob" data-k="${k}"><span class="w">${ic('warn')}</span><span>${p.msg}</span><span class="where">hw04.tex:${BLOCKS[p.block].line}</span></button>`).join('') +
    `<button class="prob" disabled style="cursor:default"><span class="i">${ic('check')}</span><span style="color:var(--ink-soft)">Built 2 pages in 0.8 s from a cached preamble.</span></button>`;
  else body.innerHTML = `<pre class="log">This is pdfTeX, Version 3.141592653-2.6-1.40.26 (TeX Live 2026)
(./hw/hw04.tex (./problems/p-incline.tex (./figs/incline.tikz))
<span class="hl">LaTeX Warning: Reference \`tab:shapes' on page 1 undefined on input line ${BLOCKS[8].line + 2}.</span>
<span class="hl">Overfull \\hbox (6.3pt too wide) in alignment at lines ${BLOCKS[9].line + 3}--${BLOCKS[9].line + 11}</span>
(./problems/p-yoyo.tex) [1] [2] )
Output written on pdf/hw04.pdf (2 pages, 68114 bytes).</pre>`;
}
$('.panel-head').addEventListener('click', e => { const b = e.target.closest('.ptab'); if (b) { state.ptab = b.dataset.p; renderPanel(); } });
$('#panel-body').addEventListener('click', e => { const b = e.target.closest('.prob[data-k]'); if (b) goBlock(PROBLEMS[+b.dataset.k].block, true); });
function renderStatus() {
  const v = vault(), b = BLOCKS[state.active], f = currentFile();
  const sec = BLOCKS.slice(0, state.active + 1).filter(x => x.sec).pop();
  $('#statusbar').innerHTML = `<button class="sb" id="sb-endpaper" title="Change this vault’s endpaper and paper"><span class="chip" style="background-image:${marbleCSS(v.theme, v.pattern, v.seed, 'small')}"></span>${esc(v.name)}</button>
    <button class="sb" title="Git branch">${ic('branch')}main*</button>
    ${f && ext(f.n) === 'tex' && sec ? `<button class="sb">§${sec.no} ${esc(sec.sec)}</button>` : ''}<span class="sb-spacer"></span>
    ${f ? `<button class="sb">Ln ${b.line + (state.active === 3 ? 2 : 0)}, Col ${state.active === 3 ? 25 : 1}</button><button class="sb">${state.viewmode === 'live' ? 'Live' : 'Source'}</button><button class="sb">Spelling: en-US</button>` : ''}
    <button class="sb" id="sb-problems" title="Problems (Ctrl+J)">${ic('warn')}2</button><button class="sb">pdfLaTeX</button>`;
}
$('#statusbar').addEventListener('click', e => {
  if (e.target.closest('#sb-endpaper')) openTheme();
  if (e.target.closest('#sb-problems')) { state.panelOpen = !state.panelOpen; state.ptab = 'problems'; layout(); }
});
const BUILD = { ok: { icon: 'check', note: 'Built · 0.8 s', cls: '' }, busy: { icon: '', note: 'Setting type…', cls: 'busy' }, err: { icon: 'alert', note: '1 error · pdf/ unchanged', cls: 'err' } };
function renderBuild() { const s = BUILD[state.build]; $('#ribbon').className = 'ribbon ' + s.cls; $('#ribbon').innerHTML = s.icon ? ic(s.icon) : ''; $('#build-note').textContent = s.note; }
$('#ribbon').onclick = () => { state.build = { ok: 'busy', busy: 'err', err: 'ok' }[state.build]; renderBuild(); };

function renderEndpop() {
  const v = vault();
  $('#endpop').innerHTML = `<h4>Palette · ${esc(v.short)}</h4><div class="swatches">${THEMES.themes.map(t => `<button class="sw ${t.id === v.theme ? 'on' : ''}" data-t="${t.id}"><span class="m" style="background-image:${marbleCSS(t.id, v.pattern, v.seed, 'small')}"><span class="lg">${logo(t.id, 'dark', 'small')}</span></span><span>${t.name}</span></button>`).join('')}</div>
    <p class="paperline">Printed on ${STOCK[v.theme].name.toLowerCase()} paper.</p>
    <h4>Marbling</h4><div class="swatches">${PATTERNS.map(([id, name]) => `<button class="sw ${id === v.pattern ? 'on' : ''}" data-pat="${id}"><span class="m" style="background-image:${marbleCSS(v.theme, id, v.seed, 'small')}"></span><span>${name}</span></button>`).join('')}</div>`;
}
function toggleEndpop(force) { const p = $('#endpop'); p.hidden = force !== undefined ? !force : !p.hidden; if (!p.hidden) renderEndpop(); }
$('#endpop').addEventListener('click', e => {
  const s = e.target.closest('.sw'); if (!s) return;

const PATTERNS = [['stone', 'Turkish stone'], ['combed', 'Bold comb'], ['nonpareil', 'Nonpareil'], ['fan', 'Fan'], ['bouquet', 'Bouquet'], ['spanish', 'Spanish wave'], ['peacock', 'Peacock']];

/* ================= thresholds ================= */
function renderWelcome(preview) {
  const w = $('#welcome'), v = preview || vault();
  w.style.backgroundImage = marbleCSS(v.theme, v.pattern, v.seed);
  w.innerHTML = `<div class="plate"><p class="exl">EX · LIBRIS</p>
    <div class="brand"><span class="lg">${logo(v.theme, 'dark', 'full')}</span><div><h1>endleaf</h1><p>LaTeX vaults, kept on your own disk.</p></div></div>
    <p class="lbl">Recent vaults</p>
    <div class="vaults">${VAULTS.map(x => `<button class="vault" data-v="${x.id}"><span class="chip" style="background-image:${marbleCSS(x.theme, x.pattern, x.seed, 'small')}"></span><span><b>${esc(x.name)}</b><small>${esc(x.path)}</small></span><span class="when">${x.when}</span></button>`).join('')}</div>
    <div class="actions"><button class="btn primary">Open a folder…</button><button class="btn">New vault…</button><button class="btn">Clone from Git…</button></div></div>`;
}
let hoverT;
$('#welcome').addEventListener('pointerover', e => {
  const b = e.target.closest('.vault'); if (!b || b.dataset.v === $('#welcome').dataset.preview) return;
  clearTimeout(hoverT); hoverT = setTimeout(() => {
    const v = VAULTS.find(x => x.id === b.dataset.v); $('#welcome').dataset.preview = v.id;

  }, 140);
});
$('#welcome').addEventListener('click', e => {
  const b = e.target.closest('.vault'); if (!b) { if (e.target.closest('.btn')) toast('Opens the system folder picker.'); return; }
  state.vault = b.dataset.v; state.screen = 'workspace'; showScreen();
});
function renderEmpty() {
  const v = vault();
  $('#empty').innerHTML = `<div class="plate empty-plate"><p class="exl">EX · LIBRIS</p><div class="lg">${logo(v.theme, 'dark', 'mid')}</div><h3>No file open</h3>
    <div class="keys"><kbd>Ctrl P</kbd><span>Go to a file</span><kbd>Ctrl N</kbd><span>New file from a template</span><kbd>Ctrl Shift F</kbd><span>Search the vault</span><kbd>Ctrl B</kbd><span>Show or hide the sidebar</span></div></div>`;
}
function showScreen() {
  const w = $('#welcome');
  $('#wlight').hidden = state.screen !== 'welcome';
  if (state.screen === 'welcome') { delete w.dataset.preview; renderWelcome(); w.hidden = false; $('#running').innerHTML = '<span class="sc">endleaf</span>'; }
  else {
    w.hidden = true;
    if (state.screen === 'empty') { state.tabs = []; state.tab = undefined; }
    else if (!state.tabs.length) { state.tabs = [{ n: 'hw04.tex', p: 'hw/hw04.tex', dirty: true }, { n: 'p-incline.tex', p: 'problems/p-incline.tex' }, { n: 'refs.bib', p: 'refs.bib' }, { n: 'physics.cls', p: 'physics.cls' }]; state.tab = 'hw/hw04.tex'; }
    applyTheme(); renderSidebar(); refreshDoc(); layout();
  }
  syncMock();
}

/* ================= quick open ================= */
let qoSel = 0;
function renderQO() {
  const q = $('#qo-in').value.toLowerCase(), list = flatFiles().filter(f => f.p.toLowerCase().includes(q));
  qoSel = Math.min(qoSel, Math.max(0, list.length - 1));
  $('#qo-list').innerHTML = list.map((f, i) => `<button class="row ${i === qoSel ? 'on' : ''}" data-file="${f.p}">${ftBadge(f.n)}<span class="nm">${esc(f.n)}</span><small>${esc(f.p.includes('/') ? f.p.slice(0, f.p.lastIndexOf('/')) : '')}</small></button>`).join('') || '<p class="hint">No file has that name.</p>';
}
function openQO() { if (state.screen === 'welcome') return; $('#qo').hidden = false; $('#qo-in').value = ''; qoSel = 0; renderQO(); $('#qo-in').focus(); }
$('#running').onclick = openQO;
$('#qo-in').addEventListener('input', () => { qoSel = 0; renderQO(); });
$('#qo-in').addEventListener('keydown', e => {
  const rows = $$('#qo-list .row');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); qoSel = (qoSel + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length; renderQO(); }
  if (e.key === 'Enter' && rows[qoSel]) { $('#qo').hidden = true; openFile(rows[qoSel].dataset.file); }
  if (e.key === 'Escape') $('#qo').hidden = true;
});
$('#qo-list').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) { $('#qo').hidden = true; openFile(r.dataset.file); } });
document.addEventListener('pointerdown', e => {
  if (!$('#qo').hidden && !e.target.closest('#qo') && !e.target.closest('#running')) $('#qo').hidden = true;
  if (!$('#endpop').hidden && !e.target.closest('#endpop') && !e.target.closest('#sb-endpaper') && !e.target.closest('#act-endpaper')) $('#endpop').hidden = true;
});

/* ================= layout ================= */
function layout() {
  $('#sidebar').hidden = !state.sideOpen; $('#split-side').hidden = !state.sideOpen;
  $('#work').style.setProperty('--sw', state.sideOpen ? state.sw + 'px' : '0px');
  $('#panel').hidden = !state.panelOpen; $('#split-panel').hidden = !state.panelOpen;
  $('#main').style.setProperty('--ph', state.panelOpen ? state.ph + 'px' : '0px');
  $('#btn-panel').classList.toggle('on', state.panelOpen);
  renderActivity(); renderPanel(); sizeBook();
}
function drag(el, move) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); document.body.classList.add('dragging');
    const mv = ev => move(ev);
    const up = () => { document.body.classList.remove('dragging'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
}
drag($('#split-side'), e => {
  const x = e.clientX - $('#work').getBoundingClientRect().left - 52;
  if (x < 140) state.sideOpen = false; else { state.sideOpen = true; state.sw = Math.min(520, Math.max(200, x)); }
  layout();
});
drag($('#split-panel'), e => {
  const r = $('#main').getBoundingClientRect(), h = r.bottom - e.clientY;
  if (h < 60) state.panelOpen = false; else state.ph = Math.min(r.height - 180, Math.max(90, h));
  layout();
});
new ResizeObserver(() => sizeBook()).observe($('#deskwrap'));
new ResizeObserver(() => { if (state.spread && state.look === 'plain') { $('#editors').style.setProperty('--pw', Math.round($('#editors').clientWidth * (1 - state.ratio)) + 'px'); fitPdf(); } }).observe($('#editors'));
const togglePdf = () => { state.spread = !state.spread; renderBook(); };
$('#btn-spread').onclick = togglePdf;
$('#pdf-x').onclick = togglePdf;
$('#pdf-zi').onclick = () => { state.pdfZoom = Math.min(2, (state.pdfZoom || +$('.pdfsheet', pdfHost()).style.zoom) + .1); fitPdf(); };
$('#pdf-zo').onclick = () => { state.pdfZoom = Math.max(.3, (state.pdfZoom || +$('.pdfsheet', pdfHost()).style.zoom) - .1); fitPdf(); };
$('#pdf-fit').onclick = () => { state.pdfZoom = 0; fitPdf(); };
drag($('#split-pdf'), e => {
  const r = $('#editors').getBoundingClientRect(), w = r.right - e.clientX;
  if (w < 200) { state.spread = false; renderBook(); return; } else state.ratio = Math.min(.8, Math.max(.3, 1 - w / r.width));
  renderPdf(); sizeBook();
});
$('#btn-panel').onclick = () => { state.panelOpen = !state.panelOpen; layout(); };
$('#panel-close').onclick = () => { state.panelOpen = false; layout(); };
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && !e.shiftKey && k === 'b') { e.preventDefault(); state.sideOpen = !state.sideOpen; renderSidebar(); layout(); }
  else if (mod && k === 'j') { e.preventDefault(); state.panelOpen = !state.panelOpen; layout(); }
  else if (mod && !e.shiftKey && k === 'p') { e.preventDefault(); openQO(); }
  else if (mod && e.altKey && k === 'v') { e.preventDefault(); togglePdf(); }
  else if (mod && (k === 'pagedown' || k === 'pageup') && state.tabs.length > 1) { e.preventDefault(); const i = state.tabs.findIndex(t => t.p === state.tab), n = state.tabs.length; switchTo(state.tabs[(i + (k === 'pagedown' ? 1 : n - 1)) % n].p); }
  else if (mod && e.shiftKey && ['e', 'f', 'y'].includes(k)) { e.preventDefault(); state.view = { e: 'files', f: 'search', y: 'symbols' }[k]; state.sideOpen = true; renderSidebar(); layout(); }
  else if (e.key === 'Escape') { $('#qo').hidden = true; $('#endpop').hidden = true; }
});
let toastT;
function toast(text) { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ================= mockup controls ================= */
function syncMock() { $$('#mk-screen button').forEach(b => b.classList.toggle('on', b.dataset.v === state.screen)); }
$('#mk-screen').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.screen = b.dataset.v; showScreen(); syncMock(); } });
$('#mk-theme-open').onclick = () => { if (state.screen === 'welcome') { state.screen = 'workspace'; showScreen(); } openTheme(); };

/* ================= boot ================= */
(async () => {
  $('#btn-spread').innerHTML = ic('book'); $('#btn-panel').innerHTML = ic('panel'); $('#panel-close').innerHTML = ic('x');
  if (innerWidth < 760) { state.sideOpen = false; state.panelOpen = false; }
  await frame();
  root.setProperty('--grainimg', `url(${grainTile()})`);
  root.setProperty('--saddleimg', `url(${leatherTile([168, 112, 63], 5)})`);
  root.setProperty('--leatherimg', `url(${leatherTile([78, 44, 27], 15)})`);
  root.setProperty('--linenimg', `url(${linenTile()})`);
  await frame();
  applyTheme(); renderSidebar(); renderBuild(); refreshDoc(); layout(); computeMeasure(); syncMock();
  $('#loading').hidden = true;
  document.fonts.ready.then(computeMeasure);
  // warm the cache for the other vaults' endpapers in the background
  setTimeout(() => VAULTS.forEach(v => marbleCSS(v.theme, v.pattern, v.seed, 'small')), 400);
})();
